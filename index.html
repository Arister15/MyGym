<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GYM">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>GYM</title>
    
    <style>
        /* DESIGN (UI & UX) */
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-sec: #8E8E93;
            --neon-green: #32d74b;
            --btn-plus: #0a84ff;
            --btn-minus: #3a3a3c;
        }

        html, body {
            overscroll-behavior-y: none; /* Prevents bounce effect on iOS */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 15px 100px 15px; /* Bottom padding for scroll */
            user-select: none; /* Prevents text selection on tapping */
            -webkit-tap-highlight-color: transparent;
        }

        /* Header & Progress */
        h1 {
            font-size: 34px;
            font-weight: 800;
            margin: 20px 0 10px 0;
            letter-spacing: 0.5px;
            text-transform: uppercase; /* Ensures GYM is capital */
        }

        .progress-container {
            margin-bottom: 25px;
        }

        .progress-bar-bg {
            background-color: var(--card-bg);
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            background-color: var(--neon-green);
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .progress-text {
            color: var(--text-sec);
            font-size: 14px;
            font-weight: 500;
        }

        /* Exercise Cards */
        #exerciseList {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .card.completed {
            opacity: 0.5;
        }

        .card-left {
            flex: 1;
        }

        .exercise-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkmark {
            display: none;
            color: var(--neon-green);
        }

        .card.completed .checkmark {
            display: inline-block;
        }

        .exercise-status {
            color: var(--text-sec);
            font-size: 14px;
        }

        .card.completed .exercise-status {
            color: var(--neon-green);
            font-weight: 600;
        }

        .card-right {
            display: flex;
            align-items: center;
