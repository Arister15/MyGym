<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GYM">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>GYM</title>
    
    <style>
        /* DESIGN (UI & UX) */
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-sec: #8E8E93;
            --neon-green: #32d74b;
            --btn-plus: #0a84ff;
            --btn-minus: #3a3a3c;
        }

        /* Αποτροπή scroll/bounce στο iOS */
        html, body {
            overscroll-behavior-y: none;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 15px 100px 15px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Header & Progress */
        h1 {
            font-size: 34px;
            font-weight: 800;
            margin: 20px 0 10px 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .progress-container {
            margin-bottom: 25px;
        }

        .progress-bar-bg {
            background-color: var(--card-bg);
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            background-color: var(--neon-green);
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .progress-text {
            color: var(--text-sec);
            font-size: 14px;
            font-weight: 500;
        }

        /* Exercise Cards */
        #exerciseList {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .card.completed {
            opacity: 0.5;
        }

        .card-left {
            flex: 1;
        }

        .exercise-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkmark {
            display: none;
            color: var(--neon-green);
        }

        .card.completed .checkmark {
            display: inline-block;
        }

        .exercise-status {
            color: var(--text-sec);
            font-size: 14px;
        }

        .card.completed .exercise-status {
            color: var(--neon-green);
            font-weight: 600;
        }

        .card-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Buttons */
        button {
            border: none;
            outline: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s;
            touch-action: manipulation; /* Αποτρέπει το ζουμ/σκρολ στα πατήματα */
        }

        button:active {
            transform: scale(0.9);
        }

        .btn-minus {
            background-color: var(--btn-minus);
            width: 36px;
            height: 36px;
        }

        .btn-plus {
            background-color: var(--btn-plus);
            width: 44px;
            height: 44px;
            font-size: 24px;
        }

        .card.completed .btn-plus {
            background-color: var(--btn-minus);
        }

        /* Reset Button */
        #resetBtn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff3b30;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            width: calc(100% - 40px);
            max-width: 400px;
            cursor: pointer;
            z-index: 10;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <header>
        <h1>GYM</h1>
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0% of weekly volume completed.</div>
        </div>
    </header>

    <main id="exerciseList"></main>

    <button id="resetBtn" onclick="resetWeek()">Reset Weekly Sets</button>

    <script>
        /* APP (Functionality & Logic) */
        
        const initialExercises = [
            { id: 1, name: "Flat Press", goal: 5, remaining: 5 },
            { id: 2, name: "Incline Press", goal: 5, remaining: 5 },
            { id: 3, name: "Shoulder Press", goal: 5, remaining: 5 },
            { id: 4, name: "Seated Row", goal: 5, remaining: 5 },
            { id: 5, name: "Lat Pulldown", goal: 5, remaining: 5 },
            { id: 6, name: "Lateral Raises", goal: 7, remaining: 7 },
            { id: 7, name: "Rear Delts", goal: 4, remaining: 4 },
            { id: 8, name: "Tricep (Overhead)", goal: 3, remaining: 3 },
            { id: 9, name: "Tricep Extension", goal: 2, remaining: 2 },
            { id: 10, name: "Biceps", goal: 5, remaining: 5 },
            { id: 11, name: "Shrugs", goal: 3, remaining: 3 },
            { id: 12, name: "Leg Press", goal: 5, remaining: 5 },
            { id: 13, name: "Leg Extension", goal: 2, remaining: 2 },
            { id: 14, name: "Leg Curl", goal: 6, remaining: 6 },
            { id: 15, name: "RDL", goal: 4, remaining: 4 }
        ];

        let exercises = [];

        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        function initApp() {
            // Η μνήμη λέγεται πλέον καθαρά gymData
            const savedData = localStorage.getItem('gymData'); 
            if (savedData) {
                exercises = JSON.parse(savedData);
            } else {
                exercises = JSON.parse(JSON.stringify(initialExercises));
            }
            renderUI();
        }

        function saveData() {
            localStorage.setItem('gymData', JSON.stringify(exercises));
            renderUI();
        }

        function addSet(id) {
            triggerHaptic();
            const ex = exercises.find(e => e.id === id);
            if (ex && ex.remaining > 0) {
                ex.remaining -= 1;
                saveData();
            }
        }

        function removeSet(id) {
            triggerHaptic();
            const ex = exercises.find(e => e.id === id);
            if (ex && ex.remaining < ex.goal) {
                ex.remaining += 1;
                saveData();
            }
        }

        function resetWeek() {
            triggerHaptic();
            if (confirm("Are you sure you want to reset all sets for the week?")) {
                exercises = JSON.parse(JSON.stringify(initialExercises));
                saveData();
            }
        }

        function renderUI() {
            const listContainer = document.getElementById('exerciseList');
            listContainer.innerHTML = '';
            
            let totalGoal = 0;
            let totalRemaining = 0;

            exercises.forEach(ex => {
                totalGoal += ex.goal;
                totalRemaining += ex.remaining;

                const isCompleted = ex.remaining === 0;
                
                const card = document.createElement('div');
                card.className = `card ${isCompleted ? 'completed' : ''}`;
                
                card.innerHTML = `
                    <div class="card-left">
                        <div class="exercise-name">
                            ${ex.name} 
                            <span class="checkmark">✓</span>
                        </div>
                        <div class="exercise-status">${ex.remaining} / ${ex.goal} sets left</div>
                    </div>
                    <div class="card-right">
                        <button class="btn-minus" onclick="removeSet(${ex.id})">-</button>
                        <button class="btn-plus" onclick="addSet(${ex.id})">+</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            const completedSets = totalGoal - totalRemaining;
            let progressPercent = 0;
            if (totalGoal > 0) {
                progressPercent = Math.round((completedSets / totalGoal) * 100);
            }

            document.getElementById('progressFill').style.width = `${progressPercent}%`;
            document.getElementById('progressText').innerText = `${progressPercent}% of weekly volume completed.`;
        }

        initApp();
    </script>
</body>
</html>
